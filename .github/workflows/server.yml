name: Server

# Tests the monitoring server against MariaDB and packs it with its dependencies for installation.
# Runs only when the server (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported pair, and a current one.
        include:
          - php: '8.4'
            db: mariadb:10.11
          - php: '8.5'
            db: mysql:8.4
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: custos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, curl, mbstring, zlib
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check PHP syntax
        run: find src bin public templates lang tools tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        env:
          CUSTOS_TEST_DB_HOST: 127.0.0.1
          CUSTOS_TEST_DB_PORT: 3306
          CUSTOS_TEST_DB_NAME: custos_test
          CUSTOS_TEST_DB_USER: root
          CUSTOS_TEST_DB_PASSWORD: root
        run: vendor/bin/phpunit --fail-on-skipped

      # The package is the server folder with vendor/ and without tests, ready to unpack on the server.
      - name: Build the package
        if: matrix.php == '8.4'
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          mkdir -p ../dist/server
          rsync -a --exclude tests --exclude phpunit.xml.dist --exclude .phpunit.cache --exclude var \
            --exclude config/config.php --exclude config/keys ./ ../dist/server/

      # The site updates itself (bin/update.php, the «Update» button) with this very package: install, update to a
      # copy with a higher version and a migration, --rollback, and a broken copy that must change nothing.
      - name: Self-update with the package
        if: matrix.php == '8.4'
        env:
          CUSTOS_TEST_DB_HOST: 127.0.0.1
          CUSTOS_TEST_DB_PORT: 3306
          CUSTOS_TEST_DB_NAME: custos_test
          CUSTOS_TEST_DB_USER: root
          CUSTOS_TEST_DB_PASSWORD: root
        run: tests/update/run.sh ../dist

      - name: Upload the package
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v6
        with:
          name: custos-server
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # The same site with the version X.Y.Z.1, zipped like a release package: only for trying the «Update» button
      # (upload from file) on a site where X.Y.Z is installed. Goes up as it is, so it is uploaded to the site as
      # downloaded.
      - name: Build the test update package
        if: matrix.php == '8.4'
        id: testpkg
        run: |
          version=$(sed -nE "s/.*const VERSION = '([^']+)'.*/\1/p" ../dist/server/src/App.php)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rm -rf ../testpkg && mkdir ../testpkg
          cp -a ../dist/server ../testpkg/server
          sed -i "s/const VERSION = '[^']*'/const VERSION = '$version.1'/" ../testpkg/server/src/App.php
          (cd ../testpkg && zip -q -r -X "../custos-server-$version.1-test.zip" server)

      - name: Upload the test update package
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v7
        with:
          path: custos-server-${{ steps.testpkg.outputs.version }}.1-test.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Say what the files are for
        if: matrix.php == '8.4'
        run: |
          v='${{ steps.testpkg.outputs.version }}'
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Сайт CUSTOS ${v}: что скачивать

          | Файл | Что это |
          |---|---|
          | \`custos-server\` | Сайт версии ${v} (zip, внутри папка \`server\`). Ставится и обновляется по INSTALL.md. |
          | \`custos-server-${v}.1-test.zip\` | Пробное обновление: тот же сайт с версией ${v}.1. Нужно только для проверки кнопки «Обновить» на сайте, где уже стоит ${v}: «Обновления» → «Сайт мониторинга» → «Обновить из файла». Загружается на сайт как есть, без распаковки. |
          EOF
