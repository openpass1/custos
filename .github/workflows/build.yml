name: Client build

# Builds and tests the Windows client and makes the installer. Runs only when the client, custos-helper (which the
# client puts into the install block) or this file changes.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'helper/custos-helper'
      - 'helper/tests/Dockerfile'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'helper/custos-helper'
      - 'helper/tests/Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { Write-Host "Inno Setup is already installed: $iscc"; exit 0 }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Windows PowerShell 5.1, the same shell the build is run with on a test machine. CUSTOS_REQUIRE_7Z makes the 7z
      # tests fail instead of being skipped if 7z.dll went missing.
      - name: Build, test and make the installer
        shell: powershell
        working-directory: client
        env:
          CUSTOS_REQUIRE_7Z: '1'
        run: .\build.ps1 -Configuration Release

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: CUSTOS-Setup
          path: client/artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

  # Dumps from real MySQL, MariaDB and PostgreSQL servers (section 6.2 of CUSTOS-client.md). Linux is enough: the
  # dumps are made by the servers' own programs, which run inside the containers (client/tools/ci-databases.sh).
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: custos-test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pcustos-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: custos-test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: custos-test
          # The image trusts 127.0.0.1 without a password, and the programs run inside the container:
          # ask for the password there too, or a wrong one is never noticed.
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare the servers and the folders of their programs
        env:
          MYSQL_ID: ${{ job.services.mysql.id }}
          MARIADB_ID: ${{ job.services.mariadb.id }}
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: bash client/tools/ci-databases.sh

      - name: Test the dumps
        working-directory: client
        env:
          CUSTOS_REQUIRE_DATABASES: '1'
        run: dotnet test tests/Custos.Core.Tests -c Release --filter "FullyQualifiedName~Database"

  # A Linux server over real SSH (CUSTOS-remote-pull.md): custos-helper installed with the block of the wizard, full and
  # incremental sets, restore into tars. The server is the test image of custos-helper (client/tools/ci-remote.sh).
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Start the Linux server
        run: bash client/tools/ci-remote.sh

      - name: Test the Linux server as a source
        working-directory: client
        env:
          CUSTOS_REQUIRE_SSH: '1'
        run: dotnet test tests/Custos.Core.Tests -c Release --filter "FullyQualifiedName~RealRemote"
