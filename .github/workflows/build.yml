name: Client build

# Builds and tests the Windows client and makes the installer. Runs only when the client, custos-helper (which the
# client puts into the install block) or this file changes; the trial window in Material 3 has its own preview.yml.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '!client/src/Custos.Preview/**'
      - '!client/tests/Custos.Preview.Shots/**'
      - 'helper/custos-helper'
      - 'helper/tests/Dockerfile'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'client/**'
      - '!client/src/Custos.Preview/**'
      - '!client/tests/Custos.Preview.Shots/**'
      - 'helper/custos-helper'
      - 'helper/tests/Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { Write-Host "Inno Setup is already installed: $iscc"; exit 0 }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Windows PowerShell 5.1, the same shell the build is run with on a test machine. CUSTOS_REQUIRE_7Z makes the 7z
      # tests fail instead of being skipped if 7z.dll went missing. Every run gets its own version 0.5.<run number>,
      # so a later build can be installed over an earlier one by an update from the server; the test update
      # 0.5.<run number>.1 is the same code with a higher version, to try that with a single build (the update
      # package of a build has the version of its installer, so it cannot update a machine installed from it).
      - name: Build, test and make the installer
        shell: powershell
        working-directory: client
        env:
          CUSTOS_REQUIRE_7Z: '1'
          # The window tests save pictures of the windows in both themes here (Stage5Tests).
          CUSTOS_SCREENSHOTS: ${{ github.workspace }}\client\artifacts\screenshots
          # Built-in cloud drive applications (client stage 4b): repository variables and secrets, empty when not set.
          CUSTOS_GDRIVE_CLIENT_ID: ${{ vars.CUSTOS_GDRIVE_CLIENT_ID }}
          CUSTOS_GDRIVE_CLIENT_SECRET: ${{ secrets.CUSTOS_GDRIVE_CLIENT_SECRET }}
          CUSTOS_YADISK_CLIENT_ID: ${{ vars.CUSTOS_YADISK_CLIENT_ID }}
          CUSTOS_YADISK_CLIENT_SECRET: ${{ secrets.CUSTOS_YADISK_CLIENT_SECRET }}
          CUSTOS_DROPBOX_CLIENT_ID: ${{ vars.CUSTOS_DROPBOX_CLIENT_ID }}
        run: .\build.ps1 -Configuration Release -Version 0.5.${{ github.run_number }} -TestUpdateVersion 0.5.${{ github.run_number }}.1

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: CUSTOS-Setup
          path: client/artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      # Pictures of the main windows in the light and the dark theme, made by the window tests.
      - name: Upload the pictures of the windows
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-screenshots
          path: client/artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      # The update packages go up as they are (archive: false, the artifact is named after the file), so what is
      # downloaded from the run page is the very zip the site takes. Wrapped into GitHub's own zip, it was refused
      # by the site ("no manifest.json") when uploaded as downloaded.
      - name: Upload the update package
        uses: actions/upload-artifact@v7
        with:
          path: client/artifacts/update/custos-0.5.${{ github.run_number }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test update package
        uses: actions/upload-artifact@v7
        with:
          path: client/artifacts/update-test/custos-0.5.${{ github.run_number }}.1-test.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Shown on the page of the run, above the files.
      - name: Say what the files are for
        shell: pwsh
        run: |
          $v = '0.5.${{ github.run_number }}'
          @"
          ### CUSTOS ${v}: что скачивать

          | Файл | Что это |
          |---|---|
          | ``CUSTOS-Setup`` | Установщик версии ${v} (zip, внутри ``CUSTOS-Setup-${v}.exe``). |
          | ``custos-${v}.zip`` | Пакет обновления ${v} для сайта, раздел «Обновления». Обновляет машины, где стоит более старая версия. Загружается на сайт как есть, без распаковки. |
          | ``client-screenshots`` | Снимки окон программы в светлой и тёмной теме, сделанные тестами. Нужны, чтобы посмотреть оформление без установки. |
          | ``custos-${v}.1-test.zip`` | Пробное обновление: те же программы с версией ${v}.1. Нужно только для проверки обновления с сайта на машине, где уже стоит ${v}. Загружается на сайт как есть, без распаковки. |
          "@ >> $env:GITHUB_STEP_SUMMARY

  # Dumps from real MySQL, MariaDB and PostgreSQL servers (section 6.2 of CUSTOS-client.md). Linux is enough: the
  # dumps are made by the servers' own programs, which run inside the containers (client/tools/ci-databases.sh).
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: custos-test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pcustos-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: custos-test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: custos-test
          # The image trusts 127.0.0.1 without a password, and the programs run inside the container:
          # ask for the password there too, or a wrong one is never noticed.
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare the servers and the folders of their programs
        env:
          MYSQL_ID: ${{ job.services.mysql.id }}
          MARIADB_ID: ${{ job.services.mariadb.id }}
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: bash client/tools/ci-databases.sh

      - name: Test the dumps
        working-directory: client
        env:
          CUSTOS_REQUIRE_DATABASES: '1'
        run: dotnet test tests/Custos.Core.Tests -c Release --filter "FullyQualifiedName~Database"

  # A Linux server over real SSH (CUSTOS-remote-pull.md): custos-helper installed with the block of the wizard, full and
  # incremental sets, restore into tars. The server is the test image of custos-helper (client/tools/ci-remote.sh).
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Start the Linux server
        run: bash client/tools/ci-remote.sh

      - name: Test the Linux server as a source
        working-directory: client
        env:
          CUSTOS_REQUIRE_SSH: '1'
        run: dotnet test tests/Custos.Core.Tests -c Release --filter "FullyQualifiedName~RealRemote"

  # Remote destinations of stage 4 (section 6.3 of CUSTOS-client.md) against real servers on the runner: OpenSSH,
  # vsftpd with and without TLS, Apache WebDAV over http and https, and MinIO with Object Lock
  # (client/tools/ci-destinations.sh). Whole runs go through the backup engine: copy, verify, restore, retention.
  # MinIO publishes neither images nor programs any more, so the script builds the server from its source with Go
  # (the version below, checked by Go's checksum database); the cache keeps the built program for the next runs.
  destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Keep the built S3 server between runs
        uses: actions/cache@v5
        with:
          path: ~/.cache/custos-ci
          key: minio-${{ env.MINIO_VERSION }}

      - name: Start the servers
        env:
          CUSTOS_MINIO: build
        run: bash client/tools/ci-destinations.sh

      - name: Test the destinations
        working-directory: client
        env:
          CUSTOS_REQUIRE_DESTINATIONS: '1'
        run: dotnet test tests/Custos.Core.Tests -c Release --filter "FullyQualifiedName~DestinationStoreTests|FullyQualifiedName~RealDestinationTests"

  # The protocol against a real CUSTOS Monitor (server/): registration, approval, the configuration snapshot, run
  # reports with a log, progress, the inventory and a command (RealMonitorTests). The server runs on PHP's own web
  # server with MariaDB (client/tools/ci-monitor.sh).
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: custos-test
          MARIADB_DATABASE: custos
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, curl, mbstring, zlib
          tools: composer:v2
          coverage: none

      - name: Start the monitoring server
        run: bash client/tools/ci-monitor.sh

      - name: Test the protocol against it
        working-directory: client
        env:
          CUSTOS_REQUIRE_MONITOR: '1'
        run: dotnet test tests/Custos.Core.Tests -c Release --filter "FullyQualifiedName~RealMonitor"
