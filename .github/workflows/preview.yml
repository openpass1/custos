name: Preview window (Material 3)

# CustosPreview.exe: a trial of the main window in Material Design 3 on Avalonia (client/src/Custos.Preview). It only
# shows what the service has and changes nothing; it is not in the installer. Runs when the trial window, the files of
# Custos.exe it shares, or this file change.
on:
  push:
    branches: [main]
    paths:
      - 'client/src/Custos.Preview/**'
      - 'client/tests/Custos.Preview.Shots/**'
      - 'client/src/Custos.Gui/ServiceMonitor.cs'
      - 'client/src/Custos.Gui/Strings*.cs'
      - 'client/src/Custos.Gui/Resources/Strings*'
      - '.github/workflows/preview.yml'
  pull_request:
    paths:
      - 'client/src/Custos.Preview/**'
      - 'client/tests/Custos.Preview.Shots/**'
      - 'client/src/Custos.Gui/ServiceMonitor.cs'
      - 'client/src/Custos.Gui/Strings*.cs'
      - 'client/src/Custos.Gui/Resources/Strings*'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  # Avalonia's build tools send anonymous usage data unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # Linux is enough to build the Windows program and to draw the window into pictures (Avalonia's headless platform).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Draw the window into pictures
        working-directory: client
        run: dotnet run -c Release --project tests/Custos.Preview.Shots -- "$GITHUB_WORKSPACE/out/screenshots"

      # Framework-dependent: uses the .NET 10 that the CUSTOS installer has already put on the computer.
      - name: Publish CustosPreview for Windows
        working-directory: client
        run: >-
          dotnet publish src/Custos.Preview -c Release -r win-x64 --self-contained false
          -p:Version=0.1.${{ github.run_number }} -o "$GITHUB_WORKSPACE/out/CustosPreview"

      - name: Upload CustosPreview
        uses: actions/upload-artifact@v6
        with:
          name: CustosPreview
          path: out/CustosPreview
          if-no-files-found: error
          retention-days: 30

      - name: Upload the pictures
        uses: actions/upload-artifact@v6
        with:
          name: CustosPreview-screenshots
          path: out/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Say what the files are for
        run: |
          size=$(du -sb out/CustosPreview | cut -f1)
          files=$(find out/CustosPreview -type f | wc -l)
          mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
          zip_mb=$(cd out && zip -qr -9 preview.zip CustosPreview && awk "BEGIN { printf \"%.1f\", $(stat -c %s preview.zip) / 1048576 }")
          echo "::notice title=Size::${mb} MB in the folder (${files} files), ${zip_mb} MB zipped"
          {
            echo "### CustosPreview 0.1.${{ github.run_number }}: пробное окно Material 3"
            echo
            echo "| Файл | Что это |"
            echo "|---|---|"
            echo "| \`CustosPreview\` | Программа для Windows: распаковать в любую папку и запустить \`CustosPreview.exe\`. Показывает задания службы CUSTOS на этом компьютере, ничего не меняет. С ключом \`--demo\` показывает придуманные задания. |"
            echo "| \`CustosPreview-screenshots\` | Снимки окна с придуманными заданиями, светлая и тёмная тема. |"
            echo
            echo "Размер программы: ${mb} МБ в папке (${files} файлов), ${zip_mb} МБ в архиве."
          } >> "$GITHUB_STEP_SUMMARY"

  # Starts the published program on a real Windows with made-up tasks: does it open, and how much memory it takes.
  # The runner has no graphics card, so this is the case of a virtual machine or a server without one.
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: CustosPreview
          path: CustosPreview

      - name: Start it, measure the memory, take a picture of the screen
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'CustosPreview\CustosPreview.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--demo' -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "CustosPreview.exe closed by itself, exit code $($p.ExitCode)." }
          $ws = [math]::Round($p.WorkingSet64 / 1MB)
          $private = [math]::Round($p.PrivateMemorySize64 / 1MB)
          $peak = [math]::Round($p.PeakWorkingSet64 / 1MB)

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $bitmap.Save((Join-Path $PWD 'shots\windows-screen.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force

          $os = (Get-CimInstance Win32_OperatingSystem).Caption
          Write-Host "::notice title=Memory after 20 s::working set $ws MB, private $private MB, peak working set $peak MB ($os)"
          @"
          ### Запуск на Windows (без видеокарты)

          $os, экран $($bounds.Width)×$($bounds.Height). Окно открылось с придуманными заданиями.

          | Память через 20 с | МБ |
          |---|---|
          | Рабочий набор (колонка «Память» в диспетчере задач близка к «Частной») | $ws |
          | Частная память | $private |
          | Наибольший рабочий набор | $peak |
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the picture of the screen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CustosPreview-windows-screen
          path: shots/*.png
          if-no-files-found: ignore
          retention-days: 30
