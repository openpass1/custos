name: Release

# Makes a DRAFT release of one part from the commit it runs on: Actions → Release → Run workflow, choose the part and
# type the version. The draft gets the files, SHA256SUMS.txt and its text: the changes from the part's CHANGELOG.md
# (client/ or server/, made by .github/release-notes.sh) and how to install and update, in English. Only people who can
# write to the repository see a draft; it becomes public when it is published by hand on the Releases page, and the tag
# (client-v<version>, client-legacy-v<version> or server-v<version>) is created at that moment.
#
# client-legacy is the edition for Windows 7 SP1 and 8.1 (build.ps1 -Legacy): released as is, only when needed, with
# the version of the client code it is built from and the text of client/CHANGELOG.md.
#
# A pull request that changes this file or release-notes.sh builds both parts with a test version and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      part:
        description: 'What to release'
        type: choice
        options: [client, client-legacy, server]
        required: true
      version:
        description: 'Version, for example 1.0.0. For the server it must equal VERSION in server/src/App.php'
        type: string
        required: true
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-notes.sh'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.part || 'test' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.check.outputs.client }}
      legacy: ${{ steps.check.outputs.legacy }}
      server: ${{ steps.check.outputs.server }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the part and the version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PART: ${{ inputs.part }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          site_version=$(sed -nE "s/.*const VERSION = '([^']+)'.*/\1/p" server/src/App.php)
          if [ "$EVENT" != workflow_dispatch ]; then
            # Test run: both parts, nothing is published. The client gets a version no real release uses.
            {
              echo "client=true"
              echo "legacy=true"
              echo "server=true"
              echo "version=0.0.1"
              echo "tag="
            } >> "$GITHUB_OUTPUT"
            echo "Test run: every part is built, nothing is published." >> "$GITHUB_STEP_SUMMARY"
            # The changelogs still give a release text, and the site's starts with its version.
            .github/release-notes.sh client top > /dev/null
            .github/release-notes.sh server "$site_version" > /dev/null
            exit 0
          fi
          fail() { echo "::error::$1"; echo "**Not released:** $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            fail "The version must look like 1.0.0 (three numbers), not \"$VERSION\". / Версия должна выглядеть как 1.0.0."
          fi
          if [ "$PART" = server ] && [ "$VERSION" != "$site_version" ]; then
            fail "server/src/App.php says VERSION = '$site_version', but the version typed is $VERSION. Release $site_version, or change App.php first. / В server/src/App.php версия $site_version, а введена $VERSION."
          fi
          tag="$PART-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            fail "The tag $tag already exists: this version is already released. / Метка $tag уже есть: эта версия уже выпущена."
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            fail "A release $tag already exists, probably a draft: delete it on the Releases page first. / Выпуск $tag уже есть, скорее всего черновик: сначала удалите его на странице Releases."
          fi
          # The release text comes from the part's CHANGELOG.md: it must start with this version. The edition for
          # Windows 7 and 8.1 is the client code built another way, so it takes the client's.
          notes=${PART%-legacy}
          if ! message=$(.github/release-notes.sh "$notes" "$VERSION" 2>&1 > /dev/null); then
            fail "$message / В $notes/CHANGELOG.md нет раздела «## $VERSION» с изменениями этой версии: его нужно добавить."
          fi
          {
            echo "client=$([ "$PART" = client ] && echo true || echo false)"
            echo "legacy=$([ "$PART" = client-legacy ] && echo true || echo false)"
            echo "server=$([ "$PART" = server ] && echo true || echo false)"
            echo "version=$VERSION"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  client:
    needs: check
    if: needs.check.outputs.client == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { Write-Host "Inno Setup is already installed: $iscc"; exit 0 }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The same script as the "Client build" workflow, with the release version; the tests run inside it.
      - name: Build, test and make the installer
        shell: powershell
        working-directory: client
        env:
          CUSTOS_REQUIRE_7Z: '1'
          VERSION: ${{ needs.check.outputs.version }}
          # Built-in cloud drive applications, as in the "Client build" workflow: without them the released program
          # cannot connect Google Drive, Yandex Disk or Dropbox.
          CUSTOS_GDRIVE_CLIENT_ID: ${{ vars.CUSTOS_GDRIVE_CLIENT_ID }}
          CUSTOS_GDRIVE_CLIENT_SECRET: ${{ secrets.CUSTOS_GDRIVE_CLIENT_SECRET }}
          CUSTOS_YADISK_CLIENT_ID: ${{ vars.CUSTOS_YADISK_CLIENT_ID }}
          CUSTOS_YADISK_CLIENT_SECRET: ${{ secrets.CUSTOS_YADISK_CLIENT_SECRET }}
          CUSTOS_DROPBOX_CLIENT_ID: ${{ vars.CUSTOS_DROPBOX_CLIENT_ID }}
        run: .\build.ps1 -Configuration Release -Version $env:VERSION

      - name: Collect the files
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item "client/artifacts/installer/CUSTOS-Setup-$env:VERSION.exe" out/
          Copy-Item "client/artifacts/update/custos-$env:VERSION.zip" out/
          Copy-Item helper/custos-helper out/
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: release-client
          path: out/
          if-no-files-found: error
          retention-days: 7

  # The edition for Windows 7 SP1 and 8.1: the same code built for .NET 6, 32-bit, with its own names. No cloud drive
  # applications: that edition has no cloud drives. The tests run on the standard edition only.
  legacy:
    needs: check
    if: needs.check.outputs.legacy == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { Write-Host "Inno Setup is already installed: $iscc"; exit 0 }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the edition for Windows 7 and 8.1
        shell: powershell
        working-directory: client
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: .\build.ps1 -Configuration Release -Legacy -Version $env:VERSION

      - name: Collect the files
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item "client/artifacts-legacy/installer/CUSTOS-Legacy-Setup-$env:VERSION.exe" out/
          Copy-Item "client/artifacts-legacy/update/custos-legacy-$env:VERSION.zip" out/
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: release-legacy
          path: out/
          if-no-files-found: error
          retention-days: 7

  server:
    needs: check
    if: needs.check.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, curl, mbstring, zlib
          tools: composer:v2
          coverage: none

      # The same package as the "Server" workflow makes: the server folder with vendor/, without the tests, settings
      # and keys. The archive holds the folder server/, so it unpacks over an installed site as it is.
      - name: Make the package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cd server
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          find src bin public templates lang tools -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          mkdir -p ../dist/server ../out
          rsync -a --exclude tests --exclude phpunit.xml.dist --exclude .phpunit.cache --exclude var \
            --exclude config/config.php --exclude config/keys ./ ../dist/server/
          cp ../LICENSE ../dist/server/LICENSE
          cp install.sh ../out/
          site_version=$(sed -nE "s/.*const VERSION = '([^']+)'.*/\1/p" src/App.php)
          name="custos-server-$site_version.zip"
          [ "$VERSION" = 0.0.1 ] || [ "$VERSION" = "$site_version" ]
          cd ../dist
          zip -q -r -X "../out/$name" server
          ls -l ../out

      - uses: actions/upload-artifact@v6
        with:
          name: release-server
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, client, legacy, server]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.check.result == 'success' &&
      (needs.client.result == 'success' || needs.legacy.result == 'success' || needs.server.result == 'success') &&
      needs.client.result != 'failure' && needs.legacy.result != 'failure' && needs.server.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ inputs.part }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          cd out
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # The changes since the previous release of the same part (tags exist for published ones only), then how to
          # install and update. English only: the guides have the Russian.
          previous=$(git tag --list "$PART-v*" --sort=-v:refname | head -n 1)
          ../.github/release-notes.sh "${PART%-legacy}" "$VERSION" "${previous#"$PART-v"}" > ../notes.md
          printf '\n---\n\n' >> ../notes.md
          blob="https://github.com/$GITHUB_REPOSITORY/blob/$TAG"
          if [ "$PART" = client ]; then
            title="CUSTOS for Windows $VERSION"
            cat >> ../notes.md <<EOF
          **Install:** run \`CUSTOS-Setup-$VERSION.exe\` (Windows 10/11, Windows Server 2019–2025, x64). An installed copy is updated in place; tasks and settings stay.

          **Update:** without a monitoring site the program checks GitHub once a day and offers **Update** in its window. With a site, its Updates page offers this version with a download button, or upload \`custos-$VERSION.zip\` there as it is.

          **custos-helper:** the script for Linux servers that the program pulls backups from, see [helper/README.md]($blob/helper/README.md). **Cloud drives:** Google Drive works as it is; Yandex Disk and Dropbox need a free application of your own, see the [steps]($blob/client/README.md#custos-applications-at-the-services).

          Checksums: \`SHA256SUMS.txt\`. The Windows files are not code-signed yet: [code signing policy]($blob/CODE_SIGNING.md). [Privacy policy]($blob/PRIVACY.md) · [All changes]($blob/client/CHANGELOG.md)
          EOF
          elif [ "$PART" = client-legacy ]; then
            title="CUSTOS for Windows 7 and 8.1 $VERSION"
            cat >> ../notes.md <<EOF
          **This is the edition for old Windows**, released as is and updated only when needed: Windows 7 SP1, 8.1, Server 2008 R2 SP1, 2012 and 2012 R2, 32 and 64-bit. On Windows 10, 11 and Server 2019+ install the standard edition (\`client-v…\` releases). Windows 8 (not 8.1) is not supported.

          **Install:** run \`CUSTOS-Legacy-Setup-$VERSION.exe\`. The 32-bit .NET 6 Desktop Runtime is inside. Windows 7 needs the updates KB3063858 and KB2999226 (or all Windows updates); the setup says when one is missing. .NET 6 and these Windows versions get no security fixes any more: keep such computers in a closed network.

          **What it lacks:** cloud drives (Google Drive, Yandex Disk, Dropbox), the dark theme, the 7-Zip update from the site. FTPS, WebDAV and S3 over https and a site over https work only with servers that still offer TLS 1.2 ciphers these Windows know.

          **Update:** with a monitoring site 1.2.0 or newer, its Updates page offers this version in the section for Windows 7 and 8.1, or upload \`custos-legacy-$VERSION.zip\` there as it is. Without a site the program checks GitHub for \`client-legacy-v…\` releases once a day.

          Checksums: \`SHA256SUMS.txt\`. The Windows files are not code-signed yet: [code signing policy]($blob/CODE_SIGNING.md). [Privacy policy]($blob/PRIVACY.md) · [All changes]($blob/client/CHANGELOG.md)
          EOF
          else
            title="CUSTOS Monitor $VERSION"
            cat >> ../notes.md <<EOF
          **Update:** the site shows the new version in the bell; press **Update the site to $VERSION** under Updates. Over SSH: \`php bin/update.php\` in the \`server\` folder, or \`bash install.sh --update\` for sites made by install.sh; without access to GitHub add \`--package=custos-server-$VERSION.zip\`. A failed update puts the old version back by itself.

          **New site:** on Debian or Ubuntu \`install.sh\` installs everything, see the [README]($blob/README.md#quick-start); on CloudPanel follow [server/INSTALL.en.md]($blob/server/INSTALL.en.md).

          Checksums: \`SHA256SUMS.txt\`. [Privacy policy]($blob/PRIVACY.md) · [All changes]($blob/server/CHANGELOG.md)
          EOF
          fi
          cat ../notes.md
          args=(--draft --target "$GITHUB_SHA" --title "$title" --notes-file ../notes.md)
          gh release create "$TAG" "${args[@]}" -- *
          url=$(gh release view "$TAG" --json url --jq .url)
          {
            echo "### Draft $title is ready"
            echo
            echo "Open [Releases]($url), check the text and the files, then press **Publish release**. Until then only you see it. The text is already complete: do not press **Generate release notes**, it adds every pull request of the repository, of both parts."
            echo
            echo "Черновик готов: откройте страницу Releases, проверьте текст и файлы и нажмите **Publish release**. До этого его видите только вы. Текст уже готов: кнопку **Generate release notes** не нажимайте, она добавляет все PR репозитория, обеих частей."
          } >> "$GITHUB_STEP_SUMMARY"
